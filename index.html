    const parts = QUESTIONS.map(q => {
      const a = e.q[q.key]; if (!a) return null;
      return SHORT[q.key] + ':' + (a.a === 'other' ? 'other' + JSON.stringify(a.other) : a.a === 'varies' ? 'varies[' + (a.all || []).join('+') + ']' : a.a) + (a.a !== 'other' && a.other ? '+other' + JSON.stringify(a.other) : '');
    }).filter(Boolean).join(' ');
    const changed = QUESTIONS.filter(q => e.q[q.key] && e.q[q.key].changes).map(q => SHORT[q.key] + e.q[q.key].changes).join(',');
    lines.push(`${i + 1} ${e.title} | ${dur(e.shown, e.done)} | ${parts}` + (changed ? ` | changed: ${changed}` : '') + (e.note ? ` | note: ${JSON.stringify(e.note)}` : ''));
  });
  lines.push('how: ' + JSON.stringify(S.how || ''));
  return lines.join('\n');
}
function copyParts() {
  const LIMIT = 1900, text = copyText(), parts = [];
  let cur = '';
  for (const line of text.split('\n')) {
    let rest = line;
    while (rest.length > LIMIT - 20) { if (cur) { parts.push(cur); cur = ''; } parts.push(rest.slice(0, LIMIT - 20)); rest = '...' + rest.slice(LIMIT - 20); }
    if (cur && (cur.length + 1 + rest.length) > LIMIT - 20) { parts.push(cur); cur = ''; }
    cur = cur ? cur + '\n' + rest : rest;
  }
  if (cur) parts.push(cur);
  return parts.length === 1 ? parts : parts.map((p, i) => `(part ${i + 1} of ${parts.length})\n` + p);
}
async function copy(text, btn) {
  const box = btn.parentElement.parentElement.querySelector('textarea');
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch (e) { if (box) { box.hidden = false; box.focus(); box.select(); } btn.textContent = 'Select the text and copy it'; }
}
function copyPanel(intro) {
  const parts = copyParts();
  return `<div class="card" id="copypanel"><p>${intro}</p>` + parts.map((p, i) => `
    <div class="copy-part" style="display:grid;gap:8px">
      <div class="row"><button class="primary" data-copy="${i}">${parts.length > 1 ? `Copy part ${i + 1} of ${parts.length}` : 'Copy my answers'}</button></div>
      <textarea class="copybox" readonly hidden>${esc(p)}</textarea>
    </div>`).join('') + `<p class="small muted">Then paste it in a Discord message to me${parts.length > 1 ? ', one part per message' : ''}.</p></div>`;
}
function wireCopy() { const parts = copyParts(); document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(parts[+b.dataset.copy], b)); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- screens
let keepPlace = false;  // true while the review is edited in place: no scrolling then
function render() {
  keep();
  document.body.style.minHeight = (scrollY + innerHeight) + 'px';  // a shorter screen never pulls the page up under the tester
  app.style.pointerEvents = 'none'; setTimeout(() => { app.style.pointerEvents = ''; }, 350);
  if (!DATA) { app.innerHTML = `<div class="card"><h2>This link looks incomplete.</h2><p>Ask me to send it again.</p></div>`; return; }
  if (!S.tester) return hello();
  const s = S.screen;
  if (s === 'past') return past();
  if (s === 'ex') return exercise();
  if (s === 'how') return how();
  if (s === 'done') return done();
  return past();
}
function bar() {
  const i = S.screen === 'ex' ? S.cur : (S.screen === 'how' || S.screen === 'done' ? 5 : -1);
  return `<div class="progress" aria-hidden="true">${S.ex.map((_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div>`;
}
function hello() {
  let last = ''; try { last = localStorage.getItem('bet3-last') || ''; } catch (e) {}
  app.innerHTML = `
    <div class="eyebrow">Five exercises</div>
    <h1>Hi.</h1>
    ${S.thanks ? `<div class="notice"><p>Thanks, ${esc(S.thanks)}. Your answers are with me. Start again any time for a fresh set.</p></div>` : ''}
    <div class="card">
      <p>This is a short questionnaire. I'll show you five common gym exercises, one at a time, and ask a few plain questions about how you do each one.</p>
      <p>Each name points at one exercise. Describe that one, the way you do it, from memory. Tick every answer that's true for you; one is usual, more than one is fine. If you've never done one, say so. <b>"Not sure"</b> is always a fine answer.</p>
      <label class="qtext" for="name">First, what's your first name?</label>
      <input type="text" id="name" autocomplete="given-name" placeholder="So I know whose answers these are" value="${esc(last)}">
      <button class="primary" id="go" disabled>Start</button>
      <p class="small muted">Your answers save as you go and come to me. Close this and come back in the same browser, type the same name, and it picks up where you left off.</p>
    </div>`;
  const gate = () => { $('#go').disabled = !normName($('#name').value); };
  $('#name').oninput = gate; gate();
  $('#name').onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); if (!$('#go').disabled) $('#go').click(); } };
  $('#go').onclick = () => { begin($('#name').value); };
}
function past() {
  app.innerHTML = `
    <div class="eyebrow">Before the exercises</div>
    <div class="card">
      <p class="qtext">When did you last write down a workout, and how?</p>
      <textarea id="pt" placeholder="A rough date, and how you kept it: an app, notes, paper.">${esc(S.past.text)}</textarea>
      <div class="row"><button class="ghost" id="never">I never have</button><button class="primary" id="next">Next</button></div>
      <div class="status" id="status"></div>
    </div>`;
  const go = never => { S.past.text = $('#pt').value.trim(); S.past.never = never; S.past.at = now(); S.screen = 'ex'; S.cur = 0; render(); save('progress'); };
  const gate = () => { $('#next').disabled = !$('#pt').value.trim(); };
  $('#never').onclick = () => go(true);
  $('#next').onclick = () => go(false);
  $('#pt').oninput = e => { S.past.text = e.target.value; keep(); gate(); };
  gate();
}
function exercise() {
  const i = S.cur, e = S.ex[i];
  if (!e.shown) { e.shown = now(); keep(); }
  const open = e.open != null ? e.open : QUESTIONS.findIndex(q => asked(q, e) && !e.q[q.key]);
  const prevAsked = k => { for (let j = k - 1; j >= 0; j--) if (asked(QUESTIONS[j], e)) return j; return -1; };
  // One question at a time sits in the slot, right under the exercise's name, with nothing below it
  // to move when it's answered; Back steps to the one before. Once all are answered, the slot holds
  // them all, where Change opens a question in its own row, then the note.
  const slot = open !== -1 ? question(QUESTIONS[open], e.q[QUESTIONS[open].key]) : `
      <div class="answers">
        <div class="eyebrow">Your answers</div>
        <div class="done-list">` + QUESTIONS.map((q, k) => !asked(q, e) ? '' : k === e.edit ? `<div class="editing">${question(q, e.q[q.key])}</div>` : `
          <div class="done-row"><span class="q">${esc(q.text)}</span><span class="a">${esc(show(q, e.q[q.key]))}</span><button class="link" data-edit="${k}">Change</button></div>`).join('') + `
        </div>
      </div>
      <label class="qtext" for="note">Anything these questions didn't let you say about it?</label>
      <textarea id="note" placeholder="Optional.">${esc(e.note)}</textarea>
      <button class="primary" id="nextex">${i < 4 ? 'Next exercise' : 'Next'}</button>`;
  const hide = ' style="visibility:hidden"';
  app.innerHTML = `
    ${bar()}
    <div class="topline"><div class="eyebrow">Exercise ${i + 1} of 5</div><div class="status top" id="status"></div></div>
    <div class="card">
      <div class="exercise-title">${esc(e.title)}</div>
      <p class="hint">Describe the exercise this name points at, the way you do it. Tick what's true for you, one answer or more, then Next.</p>
      <div class="qnav"${open === -1 ? ' hidden' : ''}><button class="link" id="back"${prevAsked(open) !== -1 ? '' : hide}>&lsaquo; Back</button><button class="link" id="skip">I've never done this one</button></div>
      <div id="slot" style="display:grid;gap:14px">${slot}</div>
    </div>`;
  status();
  // Scrolled past the question to reach an answer low down? The next one starts at the top, the same place every time.
  if (!keepPlace && $('#slot').getBoundingClientRect().top < 0) window.scrollTo(0, 0);
  keepPlace = false;
  $('#back').onclick = () => { const p = prevAsked(open); if (p !== -1) { e.open = p; render(); } };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { e.edit = +b.dataset.edit; keepPlace = true; render(); });
  wireQuestion(e, open !== -1 ? open : e.edit != null ? e.edit : -1);
  if ($('#note')) {
    $('#note').oninput = ev => { e.note = ev.target.value; keep(); };
    $('#nextex').onclick = () => { e.note = $('#note').value.trim(); e.done = now(); delete e.edit; nextExercise(); };
  }
  $('#skip').onclick = () => {
    $('#slot').innerHTML = `<p>Skip ${esc(e.title)}? That's fine if you've never done it.</p>
      <div class="row"><button class="ghost" id="no">Keep going</button><button class="primary" id="yes">Skip it</button></div>`;
    $('#no').onclick = () => render();
    $('#yes').onclick = () => { e.dontRemember = true; e.done = now(); nextExercise(); };
  };
}
function nextExercise() {
  delete S.ex[S.cur].open;
  if (S.cur < 4) { S.cur++; S.screen = 'ex'; } else { S.screen = 'how'; }
  render(); window.scrollTo(0, 0); save('progress');
}
function show(q, a) {
  if (a.a === 'unsure') return 'Not sure';
  if (a.a === 'other') return 'Something else: ' + a.other;
  const more = a.other ? ' or Something else: ' + a.other : '';
  return a.a === 'varies' ? (a.all || []).map(c => LABEL[q.key][c] || c).join(' or ') + more + ' (more than one)' : a.a.split('+').map(c => LABEL[q.key][c] || c).join(', ') + more;
}
const ticked = a => !a ? [] : a.a === 'unsure' ? ['unsure'] : a.a === 'other' ? ['other'] : picks(a).concat(a.other ? ['other'] : []);  // what shows as ticked
// Version 16 (founder, 2026-10-05, "option 1"): every question is a tick list; one tick is the answer as before, more than one is kept as the answer's set ('varies', all).
const picks = a => !a ? [] : a.a === 'varies' ? (a.all || []) : a.a !== 'unsure' && a.a !== 'other' ? a.a.split('+') : [];
const has = (a, code) => picks(a).includes(code);                           // the answer, or one of its ticks when it varies
const only = (a, code) => picks(a).length === 1 && picks(a)[0] === code;    // one way only
function question(q, a) {
  // Version 17 (founder, 2026-10-05, from their dry run): every answer is a tick, "Not sure" and "Something else" too; "Something else"
  // shows its words in place; the one Next answers with everything ticked.
  const t = ticked(a);
  const tick = (code, label, cls = '') => `<button class="opt${t.includes(code) ? ' picked' : ''}${label.length > 16 ? ' wide' : ''}${cls}" data-t="${code}" aria-pressed="${t.includes(code)}">${esc(label)}</button>`;
  return `
    <div style="display:grid;gap:10px" id="qcard">
      <p class="qtext">${esc(q.text)}</p>
      ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ''}
      <div class="opts two">
        ${q.opts.map(([code, label]) => tick(code, label)).join('')}
        ${tick('unsure', 'Not sure', ' aside')}
        ${tick('other', 'Something else', ' aside')}
        <input type="text" id="othertext" style="grid-column:1/-1" placeholder="Say it in your own words" value="${a && a.other ? esc(a.other) : ''}"${t.includes('other') ? '' : ' hidden'}>
        <button class="primary" id="multiok"${t.length && (!t.includes('other') || (a && a.other)) ? '' : ' disabled'}>Next</button>
      </div>
    </div>`;
}
function wireQuestion(e, open) {
  if (open === -1) return;
  const q = QUESTIONS[open];
  if (!e.q[q.key] || !e.q[q.key].shown) { e['shown_' + q.key] = e['shown_' + q.key] || now(); }
  const set = (code, other, all) => {
    const prev = e.q[q.key];
    const changed = prev && (prev.a !== code || (prev.other || '') !== (other || '') || (prev.all || []).join('+') !== (all || []).join('+'));
    e.q[q.key] = { a: code, other: other || undefined, all: code === 'varies' ? all : undefined, at: now(), shown: prev ? prev.shown : (e['shown_' + q.key] || now()), changes: (prev ? prev.changes || 0 : 0) + (changed ? 1 : 0) };
    delete e['shown_' + q.key];
    keepPlace = e.edit != null;
    delete e.open; delete e.edit;
    render();
    save('progress');
  };
  {  // every answer is a tick (version 17): taps only mark them, with no redraw; Next answers with everything ticked
    const sel = new Set(ticked(e.q[q.key]));
    const field = $('#othertext'), nextBtn = $('#multiok');
    const refresh = () => {
      document.querySelectorAll('#qcard [data-t]').forEach(x => { x.classList.toggle('picked', sel.has(x.dataset.t)); x.setAttribute('aria-pressed', sel.has(x.dataset.t)); });
      field.hidden = !sel.has('other');
      nextBtn.disabled = !sel.size || (sel.has('other') && !field.value.trim());
    };
    document.querySelectorAll('#qcard [data-t]').forEach(b => b.onclick = () => {
      const c = b.dataset.t; if (sel.has(c)) sel.delete(c); else sel.add(c);
      if ((c === 'none' || c === 'unsure') && sel.has(c)) { for (const x of [...sel]) if (x !== c) sel.delete(x); } else { sel.delete('none'); sel.delete('unsure'); }  // "none" and "Not sure" stand alone
      refresh();
      if (c === 'other' && sel.has('other')) field.focus();
    });
    field.oninput = refresh;
    field.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); if (!nextBtn.disabled) nextBtn.click(); } };
    nextBtn.onclick = () => {
      if (nextBtn.disabled) return;
      const text = sel.has('other') ? field.value.trim() : undefined;
      const chosen = q.opts.map(o => o[0]).filter(c => sel.has(c));
      if (sel.has('unsure')) set('unsure');
      else if (!chosen.length) set('other', text);
      else if (q.multi) set(chosen.join('+'), text);
      else if (chosen.length === 1 && !text) set(chosen[0]);
      else set('varies', text, chosen);
    };
  }
}
function how() {
  app.innerHTML = `
    ${bar()}
    <div class="eyebrow">Last question</div>
    <div class="card">
      <label class="qtext" for="how">How was that?</label>
      <textarea id="how" placeholder="In your own words. Short is fine.">${esc(S.how)}</textarea>
      <button class="primary" id="finish">Finish</button>
      <div class="status" id="status"></div>
    </div>`;
  status();
  $('#how').oninput = ev => { S.how = ev.target.value; keep(); };
  $('#finish').onclick = async () => {
    S.how = $('#how').value.trim(); S.finished = S.finished || now(); S.screen = 'done'; S.sending = true;
    render(); await save('final'); S.sending = false; render();
  };
}
function done() {
  if (S.saves.finalOk && !S.sending) {  // version 15: a set that is in sends the page back to the start, with thanks; the set stays kept under its own key
    const first = S.first; S = { screen: 'hello', saves: {}, thanks: first }; STORE = 'bet3-none';
    return hello();
  }
  if (S.sending) { app.innerHTML = `${bar()}<div class="card"><p>Sending your answers to me...</p></div><details><summary class="small muted">Taking a while? Copy your answers instead</summary>${copyPanel('Paste this to me on Discord.')}</details>`; wireCopy(); return; }
  const sent = !!S.saves.finalOk;
  app.innerHTML = `
    ${bar()}
    <h1>Thanks, ${esc(S.first)}.</h1>
    ${sent ? `<div class="card"><p>Your answers are with me. That's everything.</p><p class="small muted">I may message you with a question or two about them.</p></div>`
           : `<div class="notice"><p><b>Your answers haven't reached me yet.</b> Tap Copy and paste them to me on Discord. Or, if your signal is back, try sending again.</p></div>
              <div class="row"><button class="primary" id="retry">Try sending again</button></div>`}
    ${sent ? `<details><summary class="small muted">Want to be sure? Copy your answers</summary>${copyPanel('Paste this to me on Discord only if I ask for it.')}</details>` : copyPanel('Your answers:')}
    <div class="status" id="status"></div>`;
  wireCopy(); status();
  if ($('#retry')) $('#retry').onclick = async () => { $('#retry').disabled = true; $('#retry').textContent = 'Sending...'; await save('final'); render(); };
}
readLink().then(d => {
  DATA = d; setUp();
  // Version 18 (founder, 2026-10-05, from their dry run: "I want that"): a run this phone has not finished, or not finished sending, comes straight back on a reload, no start screen, no tap.
  let last = ''; try { last = localStorage.getItem('bet3-last') || ''; } catch (e) {}
  const open = last && localRuns(normName(last)).find(k => Array.isArray(k.ex) && k.ex.length === 5 && (!k.finished || !(k.saves && k.saves.finalOk)));
  if (open) begin(last); else render();
  document.addEventListener('visibilitychange', () => { if (DATA && document.hidden && S.tester) save(S.screen === 'done' ? 'final' : 'progress'); });
});
</script>
</body>
