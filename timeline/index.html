<!doctype html>
<!--
  The timeline (the founder's ask of 2026-10-28 23:09:24 UTC, "a page where a person can enter their name and see an
  infinite scroll timeline of all of their sets ... grouped by day"), a tool for their own use of the Describer, not a bet; then their
  "a name dropdown and have it not be filtered by names by default ... annotate each set with the name of the person
  who logged it" (23:13:57 UTC): everyone's sets in one feed, each with its name, and a dropdown to narrow it to one.
  It reads what the Describer already saves and changes nothing: describer_timeline (describer/describer-records.sql),
  every name's newest record of each day, with the code the link carries after '#', and the Key the Describer serves
  beside it for the labels and their order. Served from exercise-check/timeline/, copied there by hand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timeline</title>
<style>
  /* The Describer's palette (App.tsx, version 10.51). */
  :root { --ink: #1d1d1f; --paper: #fff; --line: #8f8e95; --accent: #5f2d91; --sub: #57565c; --wash: #f2f2f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  /* A short feed sits at the bottom, over the bar, as a text thread's does. */
  main { max-width: 560px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  #feed { margin-top: auto; }
  /* The bar at the screen's bottom edge, where Describe exercise sits on the Describer's home screen (App.tsx, styles.bar). */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar select { display: block; max-width: 528px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  select { width: 100%; min-height: 48px; font: inherit; padding: 0 12px; color: var(--ink); background: var(--paper); border: 2px solid var(--accent); border-radius: 10px; }
  .about { color: var(--sub); font-size: 15px; margin: 8px 0 0; }
  .day { position: sticky; top: 0; background: var(--paper); padding: 16px 0 6px; margin: 0; font-size: 15px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--line); }
  .exercise { padding: 10px 0; display: grid; gap: 6px; }
  .exercise + .exercise { border-top: 1px solid var(--wash); }
  .card { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .card span { padding: 2px 8px; background: var(--wash); border-radius: 6px; }
  .set { font-size: 17px; font-variant-numeric: tabular-nums; }
  .who { color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Timeline</h1>
  <div id="feed"></div>
  <p class="about" id="status"></p>
</main>
<div class="bar"><select id="who" aria-label="Whose sets"><option value="">Everyone</option></select></div>
<script type="module">
// How the Key runs, a card's lines, the day's cards and their words are the Describer's own (describer/typescript-move.md).
import { holdKey, readKey, cardLines, survivorOf, daysOf, dayWords, clock, renamedCoords, placedBy } from '../describer/engine.js';
const SERVER = { url: 'https://hnyvbuvzfyjfffbonngo.supabase.co', key: 'sb_publishable_Lz-SVsTTyPr0GVf7bLfQ-Q_V3FLRyIW' };
const code = (() => { try { return decodeURIComponent(location.hash.slice(1)).trim(); } catch { return ''; } })();
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
let KEY = null;
// The Key as the Describer serves it, checked as the phone checks it (readKey) and held, so the cards below read it
// through the Describer's own engine (describer/engine.ts, served as engine.js beside describer-key.json).
const loadKey = async () => {
  if (KEY) return KEY;
  const k = readKey(await (await fetch('../describer/describer-key.json', { cache: 'no-cache' })).json());
  if (!k) throw new Error("the Describer's Key doesn't read");
  holdKey(k); return (KEY = k);
};

// Each name's newest record of each day, as describer_record gives one name's.
async function readAll() {
  const r = await fetch(`${SERVER.url}/rest/v1/rpc/describer_timeline`, { method: 'POST', headers: { apikey: SERVER.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }) });
  if (!r.ok) throw new Error(`the server answered ${r.status}`);
  const rows = await r.json();
  return Array.isArray(rows) ? rows : [];
}

let ALL = null;
async function load() {
  $('status').textContent = 'Reading…';
  try {
    const [, rows] = await Promise.all([loadKey(), readAll()]);
    // Oldest first, so a later copy of an Exercise wins.
    const docs = rows.map((x) => ({ ...x.doc, who: x.tester })).sort((a, b) => String(a.savedAt).localeCompare(String(b.savedAt)));
    const exercises = new Map(); const sets = new Map(); const added = []; const moves = new Map();
    for (const d of docs) {
      for (const m of d.moves || []) moves.set(`${d.who}\u0000${m.id}`, { ...m, sets: (m.sets || []).map((id) => `${d.who}\u0000${id}`), to: `${d.who}\u0000${m.to}` });
      for (const e of d.exercises || []) exercises.set(`${d.who}\u0000${e.id}`, e);
      for (const a of d.attributes || []) if (!added.some((b) => b.key === a.key)) added.push(a);
      for (const s of d.sets || []) { const k = `${d.who}\u0000${s.id}`; const had = sets.get(k); sets.set(k, { ...s, who: d.who, deleted: (had && had.deleted) || s.deleted }); }
    }
    // An Exercise merged into another reads as the one it was merged into (the engine's survivorOf), by its name's record.
    const survivor = (who, id) => survivorOf((x) => exercises.get(`${who}\u0000${x}`), id);
    // Read like a text message thread, the newest at the bottom (the founder, 2026-10-29 01:44:21 UTC: "I want it to
    // read like a text message thread, with the newest ones at the bottom. And the leading edge of the feed at the
    // bottom of the screen"; until then the newest first, their "Last set first", 23:14:27 UTC 2026-10-28).
    const live = [...sets.values()].filter((s) => !s.deleted).sort((a, b) => a.t.localeCompare(b.t));
    // A set an Edit moved stands on the card it was moved to (version 10.81, the Describer's placedBy).
    const placed = placedBy([...moves.values()]);
    ALL = { exercises, added, survivor, live, placed };
    const names = [...new Set(live.map((s) => s.who))].sort();
    for (const n of names) $('who').append(new Option(n, n));
    $('who').value = names.includes(store.get()) ? store.get() : '';
    show();
  } catch (err) {
    $('status').textContent = `Couldn't read the sets: ${err.message}. Try again in a moment.`;
  }
}

function show() {
  const { exercises, added, survivor, placed } = ALL; const who = $('who').value;
  const live = ALL.live.filter((s) => !who || s.who === who);
  const feed = $('feed'); feed.replaceChildren();
  {
    // Each day oldest first, the sets in the order lifted. A set joins the card before it only when it is on the same
    // Exercise, read through merges, by the same name, with no other set that stands between them (the founder, 2026-10-29
    // 00:09:03 UTC: "Two sets of the same exercise description that are adjacent can have their descriptions joined but two
    // that aren't can't"; the Design Advisor's one view, section 9): the Describer's daysOf, on sets keyed by name and id.
    const keyed = live.map((s) => ({ ...s, exerciseId: placed.get(`${s.who}\u0000${s.id}`) || `${s.who}\u0000${s.exerciseId}` }));
    const { earlier } = daysOf(keyed, (jid) => { const [who, id] = jid.split('\u0000'); return `${who}\u0000${survivor(who, id)}`; }, [], '');
    $('status').textContent = live.length ? `${live.length} ${live.length === 1 ? 'set' : 'sets'} over ${earlier.length} ${earlier.length === 1 ? 'day' : 'days'}.` : 'No sets saved yet.';
    for (const { session, cards } of earlier) {
      const section = el('section');
      section.append(el('h2', 'day', dayWords(session)));
      for (const { exerciseId, sets } of cards) {
        const block = el('div', 'exercise');
        const card = el('div', 'card'); const e = exercises.get(exerciseId);
        for (const l of e ? cardLines(renamedCoords(e.coords || {}), added) : ['(exercise missing)']) card.append(el('span', '', l));
        block.append(card);
        for (const s of sets) {
          const row = el('div', 'set', `${clock(s.t)}  ${s.weight || '–'} × ${s.reps || '–'}`);
          row.append(el('span', 'who', `  ${s.who}`));
          block.append(row);
        }
        section.append(block);
      }
      feed.append(section);
    }
    // The page opens and rests at its end, the newest set in view above the bar; so does a change of name.
    window.scrollTo(0, document.documentElement.scrollHeight);
  }
}

const store = { get: () => { try { return localStorage.getItem('timeline-who') || ''; } catch { return ''; } }, set: (v) => { try { localStorage.setItem('timeline-who', v); } catch {} } };
$('who').addEventListener('change', () => { store.set($('who').value); show(); });
if (!code) { $('status').textContent = 'Open this page with the link you were given: the part after # lets it read the sets.'; $('who').parentElement.hidden = true; }
else void load();
</script>
</body>
</html>
