<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Describer has moved</title>
<script>
  // The Finder became the Describer on 2026-10-18; its page moved from /finder/ to /describer/. The code after # is kept,
  // so an old link or a home-screen icon lands on the same record; the phone's saved data is per site, so it is kept too.
  location.replace('/exercise-check/describer/' + location.search + location.hash);
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px; max-width: 560px; margin: 0 auto;">
<p>The Describer has moved. <a id="go" href="/exercise-check/describer/">Open it here</a>; your code and your saved sets come with you.</p>
<script>document.getElementById('go').href = '/exercise-check/describer/' + location.search + location.hash;</script>
</body>
</html>
